name: NPM Publish

env:
  NODE_VERSION: 24

on:
  release:
    types: [created]

jobs:
  test-lib:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{env.NODE_VERSION}}
          cache: npm

      - run: npm ci

      - run: npm run build:lib
      - run: npm run test:lib

  publish-npm:
    needs: test-lib
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{env.NODE_VERSION}}
          cache: npm

      # npm >= 11.5.1 is required for OIDC trusted publishing
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build:lib

      - run: npm publish dist/ngx-editor/ --provenance
